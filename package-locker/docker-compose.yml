services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everest
      POSTGRES_PASSWORD: everest
      POSTGRES_DB: everest_locker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everest -d everest_locker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://everest:everest@db:5432/everest_locker
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
    depends_on:
      - api

  api-test:
    profiles: ["test"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api:/app
    command: sh -c "npm ci && npm test"

volumes:
  postgres_data: